<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلتي إلى عالم الحيوانات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:linear-gradient(#bde7ff,#fff7e0 60%);background-attachment:fixed;color:#2b2a4c;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;min-height:100vh;font-size:22px}
#app{max-width:820px;margin:auto;padding:14px;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:22px;padding:14px 26px;background:#ff8a3d;color:#fff;font-weight:700;box-shadow:0 5px 0 #0003;margin:6px}
button:active{transform:translateY(3px)}button:disabled{opacity:.5}
.g{background:#2fb673}.bl{background:#3a86ff}.sm{padding:6px 14px;font-size:20px;margin:0 8px}
h1{font-size:1.9em;margin:.2em}.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 6px 0 #0002;margin:12px 0}
.big{font-size:min(28vw,150px);line-height:1.15}
input{font:inherit;padding:12px;border-radius:16px;border:3px solid #3a86ff;width:85%;text-align:center;margin:6px;color:#2b2a4c;background:#fff}
.bar{height:16px;background:#fff;border-radius:9px;overflow:hidden;margin:8px 0;box-shadow:inset 0 0 0 2px #0002}
.bar i{display:block;height:100%;background:#2fb673;transition:width .4s}
.guide{background:#fff;border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;text-align:right;box-shadow:0 4px 0 #0002}
.guide b{font-size:2.2em}.guide span{flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.opt{background:#fff;color:#2b2a4c;border:4px solid #3a86ff;display:flex;flex-direction:column;align-items:center;margin:0;min-height:120px;justify-content:center}
.opt b{font-size:3em;line-height:1.1}.opt.bad{background:#ffe0e6;border-color:#ef476f}.opt.good{background:#d6f7e6;border-color:#2fb673}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.tile{background:#fff;color:#2b2a4c;margin:0;border:4px solid #ffb703;min-height:110px}.tile.ok{border-color:#2fb673;background:#d6f7e6}.tile:disabled{background:#eee;border-color:#ccc}
.tile b{display:block;font-size:2.2em}#fb{font-weight:700;min-height:60px}
.cert{border:12px double #ffb703;background:#fffdf3;padding:26px;border-radius:20px}
table{width:100%;border-collapse:collapse;font-size:16px;background:#fff}td,th{border:1px solid #ccc;padding:6px}
.sp{font-size:.7em;opacity:.8}
body{background:radial-gradient(circle at 10% 7%,#ffe66d 0 6%,#ffd23f 6.5% 8%,transparent 8.5%),linear-gradient(#7fd3ff,#d9f4ff 45%,#fff3c4 78%,#c9f5a8);background-attachment:fixed;font-family:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif}
body::before{content:'☁️          ☁️        ☁️';position:fixed;top:8px;left:0;right:0;font-size:46px;white-space:pre;pointer-events:none;animation:drift 25s ease-in-out infinite alternate;z-index:0}
body::after{content:'🌳🌷🐛🌼🍄🌻🦋🌳🌷🐞🌼';position:fixed;bottom:0;left:0;right:0;font-size:32px;text-align:center;letter-spacing:8px;white-space:nowrap;overflow:hidden;background:linear-gradient(#86e05a,#4fb43a);border-top:5px solid #3a9a2a;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:2}
#app{position:relative;z-index:1;padding-bottom:100px}
h1{background:linear-gradient(90deg,#ff5d8f,#ff9f1c,#2ec4b6,#3a86ff,#8338ec);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.card{border:5px dashed #ffb703;background:#fffdf5}
.guide{border:4px solid #3a86ff;background:#fff}
.guide b{display:inline-block;animation:bob 1.8s ease-in-out infinite}
.big{animation:pop .5s}
.bar{height:20px;border:3px solid #fff}.bar i{background:repeating-linear-gradient(45deg,#2fb673 0 14px,#6be29d 14px 28px)}
button{background:linear-gradient(#ffa63d,#ff7a1a);border:3px solid #fff}.g{background:linear-gradient(#4fd88e,#1fa766)}.bl{background:linear-gradient(#5aa0ff,#2f6fe0)}
.opt{border-width:5px;transition:transform .15s}.opt:hover{transform:rotate(-2deg) scale(1.04)}
.opt:nth-child(4n+1){border-color:#ff6b6b}.opt:nth-child(4n+2){border-color:#ffb703}.opt:nth-child(4n+3){border-color:#2ec4b6}.opt:nth-child(4n){border-color:#8338ec}
.tile:not(.ok):not(:disabled):nth-child(5n+1){border-color:#ff6b6b;background:#fff0f0}.tile:not(.ok):not(:disabled):nth-child(5n+2){border-color:#ffb703;background:#fff8e1}.tile:not(.ok):not(:disabled):nth-child(5n+3){border-color:#2ec4b6;background:#e6fbf8}.tile:not(.ok):not(:disabled):nth-child(5n+4){border-color:#8338ec;background:#f3ebff}.tile:not(.ok):not(:disabled):nth-child(5n){border-color:#3a86ff;background:#e8f1ff}
.tile:hover:not(:disabled){transform:scale(1.06) rotate(2deg)}
input{border-color:#ff9f1c;box-shadow:0 4px 0 #ffd27a}
.conf{position:fixed;top:-50px;font-size:34px;animation:fall 1.8s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}@keyframes pop{from{transform:scale(.5)}}@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@media print{body{background:#fff}body::before,body::after{display:none}button,.noprint{display:none}}
</style></head><body><div id="app"></div>
<script>
const R=a=>a[Math.random()*a.length|0],sh=a=>[...a].sort(()=>Math.random()-.5),pick=(a,n)=>sh(a).slice(0,n);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR={'قطة':'قِطَّة','كلب':'كَلْب','أرنب':'أَرْنَب','بقرة':'بَقَرَة','خروف':'خَرُوف','دجاجة':'دَجَاجَة','حصان':'حِصَان','أسد':'أَسَد','فيل':'فِيل','قرد':'قِرْد','زرافة':'زَرَافَة','دب':'دُبّ','جمل':'جَمَل','عقرب':'عَقْرَب','سمكة':'سَمَكَة','دلفين':'دُلْفِين','أخطبوط':'أُخْطُبُوط','عصفور':'عُصْفُور','ضفدع':'ضِفْدَع','مواء':'مُوَاء','نباح':'نُبَاح','خوار':'خُوَار','ثغاء':'ثُغَاء','نقنقة':'نَقْنَقَة','زئير':'زَئِير','صهيل':'صَهِيل','نقيق':'نَقِيق','كتكوت':'كُتْكُوت','جرو':'جَرْو','عجل':'عِجْل','مهر':'مُهْر','حمل':'حَمَل','لبدة':'لِبْدَة','خرطوم':'خُرْطُوم','سنام':'سَنَام','زعانف':'زَعَانِف','جناحان':'جَنَاحَان','عش':'عُشّ','جحر':'جُحْر','حظيرة':'حَظِيرَة','عظم':'عَظْم','جزر':'جَزَر','عشب':'عُشْب','حبوب':'حُبُوب','موز':'مَوْز','لحم':'لَحْم','عسل':'عَسَل','سمك':'سَمَك'};
let VO=null,VL=[];
function sc(v){return(/natural|online/i.test(v.name)?50:0)+(/google/i.test(v.name)?30:0)+(/hamed|zariyah|salma|shakir|laila|majed|maged|tarik|mariam|maryam|naayf/i.test(v.name)?10:0)+(/ar-SA/i.test(v.lang)?5:0)}
function vs(){try{VL=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));let s=null;try{s=localStorage.getItem('zooV')}catch(e){}VO=VL.find(v=>v.voiceURI==s)||VL.slice().sort((a,b)=>sc(b)-sc(a))[0]||null;fillV()}catch(e){}}
function fillV(){const b=document.getElementById('vb');if(!b)return;b.innerHTML=VL.length?'<select onchange="setV(this.value)" style="font:inherit;font-size:16px;padding:8px;border-radius:12px;max-width:90%">'+VL.map(v=>'<option value="'+esc(v.voiceURI)+'"'+(v==VO?' selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select><button class=sm onclick="say(\'مرحبا يا مستكشف، أنا البومة\')">🔊 جرّب الصوت</button>':'<div class=sp>لم يُعثر على صوت عربي في هذا الجهاز. جرّب متصفح Chrome أو Edge أو Safari.</div>'}
function setV(u){try{localStorage.setItem('zooV',u)}catch(e){}vs();say('مرحبا يا مستكشف، أنا البومة')}
try{speechSynthesis.onvoiceschanged=vs}catch(e){}vs();
function say(t){return;try{speechSynthesis.cancel();t=t.replace(/[^\u0600-\u06FF0-9\s.،؟!:]/g,' ').replace(/[\u0621-\u064A]+/g,w=>PR[w]||(w.slice(0,2)=='ال'&&PR[w.slice(2)]?'ال'+PR[w.slice(2)]:w));setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang=VO?VO.lang:'ar-SA';if(VO)u.voice=VO;u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)},80)}catch(e){}}
let ac;function tone(f,d,t){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);t=t||0;o.start(ac.currentTime+t);o.stop(ac.currentTime+t+(d||.15))}catch(e){}}
const V=(a,m,f)=>a.n.slice(-1)=='ة'?f:m;
const Z=[
{e:'🐱',n:'قطة',ty:'pet',fd:'🐟|سمك',so:'مواء',mv:'مشي'},
{e:'🐶',n:'كلب',ty:'pet',fd:'🦴|عظم',so:'نباح',mv:'جري'},
{e:'🐰',n:'أرنب',ty:'pet',fd:'🥕|جزر',mv:'قفز',hm:'جحر'},
{e:'🐄',n:'بقرة',hb:'مزرعة',fd:'🌿|عشب',so:'خوار',mv:'مشي',hm:'حظيرة'},
{e:'🐑',n:'خروف',hb:'مزرعة',so:'ثغاء'},
{e:'🐔',n:'دجاجة',hb:'مزرعة',fd:'🌾|حبوب',so:'نقنقة'},
{e:'🐴',n:'حصان',hb:'مزرعة',so:'صهيل',mv:'جري'},
{e:'🦁',n:'أسد',ty:'wild',hb:'غابة',fd:'🍖|لحم',so:'زئير',ft:'لبدة'},
{e:'🐘',n:'فيل',ty:'wild',hb:'غابة',ft:'خرطوم'},
{e:'🐒',n:'قرد',ty:'wild',hb:'غابة',fd:'🍌|موز'},
{e:'🦒',n:'زرافة',ty:'wild',hb:'غابة',ft:'رقبة طويلة'},
{e:'🐻',n:'دب',ty:'wild',hb:'غابة',fd:'🍯|عسل'},
{e:'🐪',n:'جمل',hb:'صحراء',ft:'سنام',mv:'مشي'},
{e:'🦂',n:'عقرب',hb:'صحراء'},
{e:'🐟',n:'سمكة',hb:'بحر',mv:'سباحة',hm:'ماء',ft:'زعانف'},
{e:'🐬',n:'دلفين',hb:'بحر',mv:'سباحة'},
{e:'🐙',n:'أخطبوط',hb:'بحر'},
{e:'🐦',n:'عصفور',mv:'طيران',hm:'عش',ft:'جناحان'},
{e:'🐸',n:'ضفدع',so:'نقيق',mv:'قفز'}];
const BB=[{n:'دجاجة',me:'🐔',b:'كتكوت',be:'🐥'},{n:'كلب',me:'🐶',b:'جرو',be:'🐕'},{n:'بقرة',me:'🐄',b:'عجل',be:'🐮'},{n:'حصان',me:'🐴',b:'مهر',be:'🐎'},{n:'خروف',me:'🐑',b:'حمل',be:'🐏'}];
const H=[['مزرعة','🚜'],['غابة','🌳'],['صحراء','🏜️'],['بحر','🌊']],MV=[['مشي','🚶'],['جري','🏃'],['قفز','🦘'],['طيران','🕊️'],['سباحة','🏊']],HM=[['عش','🪺'],['جحر','🕳️'],['حظيرة','🏡'],['ماء','🌊']];
const CARE=[
{s:'القطة عطشانة، ماذا نفعل؟',e:'🐱',g:['💧','نعطيها ماءً'],b:['✋','نضربها']},
{s:'الكلب جائع، ماذا نفعل؟',e:'🐶',g:['🦴','نطعمه'],b:['🚫','نتركه جائعًا']},
{s:'وجدنا عصفورًا صغيرًا، ماذا نفعل؟',e:'🐦',g:['🤲','نحميه برفق'],b:['🪨','نرميه بحجر']},
{s:'نحب البحر والسمك، ماذا نفعل؟',e:'🐟',g:['🧹','نحافظ على نظافته'],b:['🗑️','نرمي فيه النفايات']}];
const O=(x,pool,f)=>sh([x,...pick(pool.filter(y=>y!==x),2)]).map(y=>Object.assign(f(y),{ok:y===x}));
const W=k=>Z.filter(x=>x[k]);
const gens=[
()=>{const a=R(Z);return Math.random()<.5?{s:'أين '+a.n+'؟',o:O(a,Z,y=>({e:y.e})),h:'هذه هي '+a.n+' '+a.e}:{s:'ما اسم هذا الحيوان؟',big:a.e,o:O(a,Z,y=>({l:y.n})),h:'اسمه '+a.n}},
()=>{const a=R(W('ty'));return{s:'هل '+a.n+' حيوان أليف أم بري؟',big:a.e,o:[{e:'🏠',l:'أليف',ok:a.ty=='pet'},{e:'🌲',l:'بري',ok:a.ty=='wild'}],h:a.ty=='pet'?'يعيش معنا في البيت':'يعيش بعيدًا عن البيوت'}},
()=>{const a=R(W('hb'));return{s:'أين '+V(a,'يعيش','تعيش')+' '+a.n+'؟',big:a.e,o:H.map(h=>({e:h[1],l:h[0],ok:h[0]==a.hb})),h:a.n+' '+V(a,'يعيش','تعيش')+' في '+a.hb}},
()=>{const a=R(W('fd'));return{s:'ماذا '+V(a,'يأكل','تأكل')+' '+a.n+'؟',big:a.e,o:O(a,W('fd'),y=>{const f=y.fd.split('|');return{e:f[0],l:f[1]}}),h:a.n+' '+V(a,'يأكل','تأكل')+' '+a.fd.split('|')[1]}},
()=>{const a=R(W('so'));return{s:'من يصدر هذا الصوت؟',snd:a.so,o:O(a,W('so'),y=>({e:y.e,l:y.n})),h:'استمع مرة أخرى'}},
()=>{const b=R(BB);return{s:'ما اسم صغير '+b.n+'؟',big:b.me,o:O(b,BB,y=>({e:y.be,l:y.b})),h:'صغير '+b.n+' اسمه '+b.b}},
()=>{const a=R(W('ft'));return{s:'أي حيوان له '+a.ft+'؟',o:O(a,Z.filter(y=>y===a||y.ft!==a.ft),y=>({e:y.e,l:y.n})),h:a.n+' له '+a.ft}},
()=>{const a=R(W('mv'));return{s:'كيف '+V(a,'يتحرك','تتحرك')+' '+a.n+'؟',big:a.e,o:sh([MV.find(m=>m[0]==a.mv),...pick(MV.filter(m=>m[0]!=a.mv),3)]).map(m=>({e:m[1],l:m[0],ok:m[0]==a.mv})),h:a.n+' '+V(a,'يتحرك','تتحرك')+' بـ'+a.mv}},
()=>{const a=R(W('hm'));return{s:'أين '+V(a,'يسكن','تسكن')+' '+a.n+'؟',big:a.e,o:HM.map(m=>({e:m[1],l:m[0],ok:m[0]==a.hm})),h:a.n+' '+V(a,'يسكن','تسكن')+' في '+a.hm}},
()=>{const c=R(CARE);return{s:c.s,big:c.e,o:sh([{e:c.g[0],l:c.g[1],ok:true},{e:c.b[0],l:c.b[1],ok:false}]),h:'نحن نرفق بالحيوانات ونحبها'}}];
const nm=n=>Z.find(a=>a.n==n);
const T=[
{t:'أسماء الحيوانات',i:'🐾',c:()=>['قطة','كلب','بقرة','أسد','فيل','سمكة'].map(n=>[nm(n).e,n,'هذه '+n])},
{t:'أليفة وبرية',i:'🏠',c:()=>[...Z.filter(a=>a.ty=='pet'),...pick(Z.filter(a=>a.ty=='wild'),3)].map(a=>[a.e,a.n,a.ty=='pet'?'حيوان أليف يعيش معنا':'حيوان بري يعيش بعيدًا'])},
{t:'مزرعة وغابة وصحراء وبحر',i:'🌍',c:()=>['بقرة','أسد','جمل','دلفين'].map(n=>{const a=nm(n);return[a.e,n,V(a,'يعيش','تعيش')+' في '+a.hb]})},
{t:'ماذا يأكل؟',i:'🍽️',c:()=>W('fd').map(a=>[a.e,a.n,V(a,'يأكل','تأكل')+' '+a.fd.split('|')[1]+' '+a.fd.split('|')[0]])},
{t:'أصوات الحيوانات',i:'🔊',c:()=>W('so').map(a=>[a.e,a.n,'',a.so,1])},
{t:'صغار الحيوانات',i:'🐣',c:()=>BB.map(b=>[b.me+b.be,b.n+' ← '+b.b,'صغير '+b.n+' اسمه '+b.b])},
{t:'أجزاء الجسم',i:'🦒',c:()=>W('ft').map(a=>[a.e,a.n,V(a,'له','لها')+' '+a.ft])},
{t:'كيف تتحرك؟',i:'🏃',c:()=>['بقرة','كلب','أرنب','عصفور','سمكة'].map(n=>{const a=nm(n);return[a.e,n,V(a,'يتحرك','تتحرك')+' بـ'+a.mv+' '+MV.find(m=>m[0]==a.mv)[1]]})},
{t:'مساكن الحيوانات',i:'🏡',c:()=>W('hm').map(a=>[a.e,a.n,V(a,'يسكن','تسكن')+' في '+a.hm])},
{t:'الرفق بالحيوان',i:'❤️',c:()=>CARE.map(c=>[c.g[0],c.g[1],c.s])}];
T.forEach((t,i)=>t.g=gens[i]);
let S={name:'',done:{},best:{},att:{},cert:0,fin:null},teacher='',Q,K=0;
const key=()=>'zoo:'+S.name;
function save(){try{localStorage.setItem(key(),JSON.stringify(S));localStorage.setItem('zooT',teacher)}catch(e){}}
function load(n){S={name:n,done:{},best:{},att:{},cert:0,fin:null};try{const d=localStorage.getItem('zoo:'+n);if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}}
function welcome(){app.innerHTML=`<div class=big>🦁🐘🐬</div><h1>رحلتي إلى عالم الحيوانات</h1><div class=card><div style="font-size:3em">🦉</div><p>مرحبًا يا مستكشف! أنا البومة، وأنا ومعلمتك مريم سنرافقك في الرحلة.</p><input id=n placeholder="اكتب اسمك هنا" maxlength=30><br><input id=tn value="مريم الشهري" placeholder="اسم المعلمة" maxlength=30 class=noprint><br><button class=g onclick="start()">▶ ابدأ</button></div><button class="bl sm" onclick="log()">📋 سجل المعلمة</button>`;try{document.getElementById('tn').value=localStorage.getItem('zooT')||'مريم الشهري'}catch(e){}fillV();setTimeout(()=>say('مرحبا يا مستكشف. رحلتي إلى عالم الحيوانات'),400)}
function start(){const n=document.getElementById('n').value.trim();if(!n){document.getElementById('n').focus();return}teacher=document.getElementById('tn').value.trim()||'مريم الشهري';load(n);save();home()}
function home(){const d=T.filter((t,i)=>S.done[i]).length,all=d==T.length;
app.innerHTML=`<div class=guide><b>🦉</b><span>${esc(S.name)}، اختر محطتك!</span></div><div class=bar><i style="width:${(d+(S.cert?1:0))/(T.length+1)*100}%"></i></div><div>⭐ ${d} من ${T.length}</div>
<div class=map>${T.map((t,i)=>`<button class="tile ${S.done[i]?'ok':''}" ${i&&!S.done[i-1]&&!S.done[i]?'disabled':''} onclick="learn(${i},0)"><b>${S.done[i]?'✅':t.i}</b>${t.t}</button>`).join('')}
<button class="tile ${S.cert?'ok':''}" ${all?'':'disabled'} onclick="${S.cert?'cert()':'final()'}"><b>🏆</b>${S.cert?'شهادتي':'التحدي الختامي'}</button></div>
<button class="bl sm" onclick="welcome()">↩ خروج</button> <button class="bl sm" onclick="log()">📋 سجل المعلمة</button>`}
function learn(i,k){K=i;const t=T[i],c=t.c(),show=j=>{const x=c[j];return`<div class=guide><b>🦉</b><span>${t.t}</span></div><div class=card><div class=big>${x[0]}</div><h1>${x[1]}</h1><div>${x[2]}</div>${x[4]?`<button class=g data-k="${x[3]}" onclick="snd(this.dataset.k)" style="font-size:1.6em">🔊 اسمع</button>`:''}</div><button ${j?'':'disabled'} onclick="go(${j-1})">▶ السابق</button><button class=g onclick="go(${j+1})">${j==c.length-1?'ابدأ التحدي 🎯':'التالي ◀'}</button>`};
window.go=j=>{if(j>=c.length)return quiz(i);app.innerHTML=show(j);if(c[j][4])setTimeout(()=>snd(c[j][3]),300)};go(0)}
function quiz(i){Q={tid:i,qs:Array.from({length:5},()=>T[i].g()),i:0,f:[],tr:0};qz()}
function qz(){const q=Q.qs[Q.i];Q.tr=0;
app.innerHTML=`<div class=bar><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div class=guide><b>🦉</b><span>${q.s}</span></div>${q.big?`<div class=big>${q.big}</div>`:''}${q.snd?'<div><button class=g style="font-size:3em;padding:18px 44px" onclick="snd(Q.qs[Q.i].snd)">🔊</button></div>':''}<div class=opts>${q.o.map((o,j)=>`<button class=opt onclick="ans(${j})">${o.e?`<b>${o.e}</b>`:''}${o.l||''}</button>`).join('')}</div><div id=fb></div>`;setTimeout(()=>{if(q.snd)snd(q.snd)},300)}
function ans(j){const q=Q.qs[Q.i],bs=document.querySelectorAll('.opt'),fb=document.getElementById('fb');
if(q.o[j].ok){if(!Q.tr)Q.f[Q.i]=1;conf();tone(660);tone(880,.2,.15);bs.forEach(b=>b.disabled=true);bs[j].classList.add('good');fb.innerHTML='🌟 أحسنت! <br><button class=g onclick="nx()">التالي ◀</button>';say('أحسنت')}
else{Q.tr++;tone(220,.25);bs[j].disabled=true;bs[j].classList.add('bad');fb.innerHTML='💪 حاول مرة أخرى'+(Q.tr>1?'<div class=sp>تلميح: '+q.h+'</div>':'');say('حاول مرة أخرى')}}
function conf(){for(let i=0;i<16;i++){const s=document.createElement('span');s.className='conf';s.textContent=R(['⭐','🎈','🎉','🌟','🦋','🍭']);s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function ctx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac}
function syn(type,f0,f1,t,d,v,lp){const c=ctx(),T0=c.currentTime+t,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f0,T0);o.frequency.exponentialRampToValueAtTime(f1,T0+d);f.type='lowpass';f.frequency.value=lp||2000;o.connect(f);f.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,T0);g.gain.exponentialRampToValueAtTime(v,T0+Math.min(.05,d/3));g.gain.exponentialRampToValueAtTime(.0001,T0+d);o.start(T0);o.stop(T0+d+.05)}
function snd(k){try{const s={
'مواء':()=>{syn('sawtooth',420,800,0,.28,.3,2600);syn('sawtooth',800,480,.28,.5,.3,2200);syn('sawtooth',840,500,.28,.5,.15,3000)},
'نباح':()=>[0,.32].forEach(t=>{syn('sawtooth',320,160,t,.16,.45,1500);syn('square',640,300,t,.1,.1,1200)}),
'خوار':()=>{syn('sawtooth',120,150,0,.5,.45,650);syn('sawtooth',150,95,.5,.8,.45,650);syn('sawtooth',241,300,0,.5,.12,900)},
'ثغاء':()=>{for(let i=0;i<9;i++)syn('sawtooth',380-i*4,340,i*.09,.085,.22,1900)},
'نقنقة':()=>[0,.14,.28,.55,.7].forEach((t,i)=>syn('square',650+i*20,420,t,.07,.13,1800)),
'زئير':()=>{syn('sawtooth',120,60,0,1.5,.5,500);syn('sawtooth',125,64,0,1.5,.4,520);syn('sawtooth',60,40,0,1.5,.3,300)},
'صهيل':()=>{syn('sawtooth',500,1300,0,.45,.28,3200);syn('sawtooth',1300,500,.45,.8,.28,2800);for(let i=0;i<5;i++)syn('sawtooth',900,700,.5+i*.12,.1,.12,2500)},
'نقيق':()=>{for(let i=0;i<7;i++)syn('square',180+(i%2)*40,150,i*.07,.05,.18,700)}}[k];if(s)s()}catch(e){}}
function nx(){Q.i++;if(Q.i<Q.qs.length)return qz();Q.tid=='final'?fin():res()}
function res(){const i=Q.tid,sc=Q.f.filter(Boolean).length,ok=sc>=4;S.att[i]=(S.att[i]||0)+1;S.best[i]=Math.max(S.best[i]||0,sc);if(ok)S.done[i]=1;save();
app.innerHTML=`<div class=big>${ok?'🎉':'🌱'}</div><h1>${ok?'أحسنت يا '+esc(S.name)+'!':'نتدرب مرة أخرى'}</h1><div class=card style="font-size:2em">${'⭐'.repeat(sc)}${'☆'.repeat(5-sc)}</div><p>${ok?'أتقنت هذه المحطة، والمحطة التالية جاهزة.':'لا بأس، التعلم رحلة! لنراجع معًا ثم نحاول.'}</p>${ok?'<button class=g onclick="home()">إلى الخريطة 🗺️</button>':'<button onclick="learn('+i+',0)">لنراجع 🔁</button>'}`;say(ok?'أحسنت':'لنراجع معا')}
function final(){Q={tid:'final',qs:T.flatMap((t,i)=>[t.g(),t.g()].map(q=>Object.assign(q,{ti:i}))),i:0,f:[],tr:0};qz()}
function fin(){const per=T.map((t,i)=>Q.qs.reduce((s,q,j)=>s+(q.ti==i&&Q.f[j]?1:0),0)),tot=per.reduce((a,b)=>a+b,0),weak=per.map((p,i)=>p<1?i:-1).filter(i=>i>=0),ok=tot>=16&&!weak.length;
S.fin={tot,per,date:new Date().toLocaleDateString('ar-SA')};if(ok)S.cert=1;else weak.forEach(i=>S.done[i]=0);save();
if(ok)return cert();app.innerHTML=`<div class=big>💪</div><h1>${tot} من 20</h1><p>أنت قريب جدًا! ${weak.length?'لنراجع: '+weak.map(i=>T[i].t).join('، '):'نحتاج 16 على الأقل، حاول مرة أخرى.'}</p><button onclick="home()">إلى الخريطة 🗺️</button>`}
function cert(){app.innerHTML=`<div class=cert><div class=big>🏅</div><h1>شهادة اجتياز وحدة الحيوانات</h1><p>تشهد الروضة بأن المستكشف الصغير</p><h1 style="color:#ff8a3d;font-size:2.4em">${esc(S.name)}</h1><p>اجتاز وحدة «رحلتي إلى عالم الحيوانات» بنجاح<br>وحصل على شارة <b>«مستكشف الحيوانات»</b> 🦁🐘🐬</p><p>${S.fin?S.fin.date:''}${teacher?' — المعلمة: '+esc(teacher):''}</p></div><button class=g onclick="window.print()">🖨️ طباعة</button><button class=bl onclick="home()">الخريطة</button>`;tone(523,.2);tone(659,.2,.2);tone(784,.3,.4);say('مبروك يا مستكشف الحيوانات')}
function log(){let rows='';try{for(let k=0;k<localStorage.length;k++){const key=localStorage.key(k);if(key.indexOf('zoo:')==0){const d=JSON.parse(localStorage.getItem(key));rows+=`<tr><td>${esc(d.name)}</td>${T.map((t,i)=>`<td>${d.done&&d.done[i]?'✅ '+d.best[i]+'/5':d.att&&d.att[i]?'⚠️ '+d.best[i]+'/5':'—'}</td>`).join('')}<td>${d.fin?d.fin.tot+'/20':'—'}</td><td>${d.cert?'🏅':'—'}</td></tr>`}}}catch(e){}
app.innerHTML=`<h1>📋 سجل المتابعة</h1><div style="overflow-x:auto"><table><tr><th>الطفل</th>${T.map((t,i)=>`<th>${i+1}</th>`).join('')}<th>الختامي</th><th>الشارة</th></tr>${rows||'<tr><td colspan=13>لا توجد بيانات بعد</td></tr>'}</table></div><p class=sp>${T.map((t,i)=>(i+1)+'. '+t.t).join(' | ')}<br>✅ أتقن (4 من 5 فأكثر) — ⚠️ يحتاج مراجعة — البيانات محفوظة في هذا الجهاز والمتصفح</p><button onclick="window.print()">🖨️ طباعة</button><button class=bl onclick="${S.name?'home()':'welcome()'}">رجوع</button>`}
welcome();
</script></body></html>
